name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - 'conf/**'
      - 'docker/**'
      - 'doc/**'
      - 'k8s/**'
      - 'scripts/**'
      - '**.md'
      - '.gitignore'

env:
  GO111MODULE: on
  GONOSUMDB: "*"
  #GOSUMDB: off

jobs:
  CommitLint:
    name: Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: .github/commitlint.config.js
  GoLint:
    name: "Code Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the --new-from-rev baseline commit is available.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Tidy Go modules
        run: go mod tidy
      - name: Run golang-ci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          # Only flag issues introduced after the baseline so pre-existing
          # upstream findings don't block this fork. On pull requests use the
          # PR base commit; on manual workflow_dispatch fall back to the
          # baseline tip. (only-new-issues has no PR diff on dispatch and would
          # otherwise surface unrelated historical errcheck findings.)
          args: --timeout=10m --tests=false --new-from-rev=${{ github.event.pull_request.base.sha || 'd976736' }}
          skip-cache: true
      - name: Run go version check
        run: make go-version-check
      - name: Run go vet check
        run: make go-vet-check
  BuildCheck:
    name: "Go Build Check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: make vendor
        run: make vendor-ci
      - name: go build linux
        run: make build-linux && make build-linux-arm
      - name: go build windows
        run: make build-windows
